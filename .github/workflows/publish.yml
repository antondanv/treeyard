name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@antondanv/treeyard
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release $TAG does not match package.json, which says $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Trusted publishing needs no token and adds provenance. npm sets up a trusted
      # publisher only for a package that exists, so the first version is published by
      # hand; a version npm already has is skipped. prepack builds dist and keeps
      # README.ru.md out of the package.
      - name: Publish what npm does not have yet
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # The version's own document: a new package's page takes minutes to appear.
          if curl -fsS -o /dev/null "https://registry.npmjs.org/$name/$version"; then
            echo "$name@$version is on npm already"
          else
            npm publish --access public
          fi
