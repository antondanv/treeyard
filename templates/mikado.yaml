id: mikado
name: Микадо
tagline: Большое изменение как дерево предпосылок — делаем с листьев
for: Рефакторинг, миграция, переезд на новый стек — изменение, где всё цепляется за всё.
order: 3
questions:
  - key: goal
    label: Изменение
    ask: Какое изменение нужно сделать? Одной фразой — как цель, которую видно по результату.
    hint: «весь доступ к базе идёт через tenant-слой», «проект собирается на Node 24»
    required: true
  - key: check
    label: Проверка
    ask: Какая команда покажет, что всё по-прежнему работает?
    hint: «npm test», «pytest -q»
method: |
  Метод Микадо. Корень — изменение, которого хотим. Пробуем сделать его в лоб.
  Если что-то ломается — НЕ чиним на месте: откатываем всё и записываем, что мешает, дочерними узлами-предпосылками.
  Повторяем для каждой предпосылки, пока не дойдём до листьев, которые делаются чисто.
  Делаем листья, каждый — отдельным зелёным коммитом, и поднимаемся вверх, пока не сделаем корень.
rules: |
  - Пробуй узел в лоб. Сломалось — откати свои правки (`git restore` / `git stash`), заведи предпосылки детьми и остановись.
  - Делай только узлы без открытых детей. Каждый сделанный узел — зелёная проверка и отдельный коммит.
  - Проверка проекта: {{check_or_default}}
nodes:
  - title: "Попробовать в лоб: {{goal}}"
    who: agent
    done_when: Либо изменение сделано и проверка зелёная, либо откат и список предпосылок заведён детьми.
    check: "{{check}}"
    body: |
      Первый заход: попытаться сделать изменение целиком и посмотреть, что сломается.
      Всё, что сломалось, — это предпосылки. Их записываем детьми, изменения откатываем.
