id: stages
name: Этапы
tagline: Этапы с критерием готовности; следующий — после проверки предыдущего
for: Новый проект с понятной целью — MVP, продукт, сервис.
order: 1
questions:
  - key: goal
    label: Цель
    ask: Как ты поймёшь, что первая версия сделала своё дело? Опиши то, что можно увидеть в жизни.
    hint: «неделю веду канал только через бота», «первый настоящий клиент оставил отзыв»
    required: true
  - key: loop
    label: Главный сценарий
    ask: Какой один сценарий должен заработать первым — от начала до конца?
    hint: «ссылка → отзыв с согласием → публикация в виджете»
  - key: appetite
    label: Аппетит
    ask: Сколько времени ты готов отдать первой версии? Объём подстроится под срок, а не наоборот.
    hint: «3 недели»
method: |
  Проект растёт этапами. У каждого этапа есть «готово, когда» и аппетит — время, которое не жалко.
  Внутри этапа порядок задач свободный; следующий этап начинаем, когда предыдущий проверен по критерию.
  Сначала замыкаем главный сценарий{{loop_suffix}} на самом простом варианте, потом обвязка.
  Не влезает в аппетит — режем объём, а не двигаем срок. Новые идеи — в «Идеи», не в текущий этап.
rules: |
  - Этап закрыт, когда его критерий проверен: командой, сценарием или скриншотом. Проверяет человек или отдельная проверяющая сессия.
  - Не начинай задачи следующего этапа, пока текущий не на проверке.
nodes:
  - title: Этап 0 — Каркас
    who: agent
    done_when: Проект запускается одной командой, тесты и линтер проходят, есть README с запуском.
    body: |
      Фундамент, на котором строится всё остальное: структура, окружение, запуск, первые тесты.
      То, что потом дорого менять (модель данных, изоляция, конфиг), решаем здесь и пишем в «Решения».
    children:
      - title: Структура репозитория и запуск одной командой
        who: agent
      - title: Модель данных и то, что дорого менять потом
        who: agent
      - title: Тесты, линтер и CI
        who: agent
  - title: Этап 1 — Главный сценарий
    who: agent
    done_when: "{{loop_done}}"
    body: |
      Самый короткий путь, на котором продукт уже приносит пользу. Без красоты и обвязки — но целиком.
  - title: Этап 2 — Вокруг сценария
    who: agent
    done_when: Сценарий удобен человеку со стороны — без подсказок автора.
    body: |
      Интерфейс, ошибки, пустые состояния, роли, лимиты — всё, без чего главным сценарием неудобно пользоваться.
  - title: Этап 3 — Запуск
    who: human
    done_when: "{{goal}}"
    body: |
      Всё, что отделяет «работает у меня» от «работает у людей»: сервер, домен, тексты, юридические вещи,
      первый настоящий пользователь. Здесь много задач, которые может сделать только человек.
  - title: Идеи
    status: idea
    body: |
      Сюда — всё, что всплывает по ходу и не нужно для цели. Вернёмся, когда цель достигнута.
