id: directions
name: Направления
tagline: Независимые ветки — одна ждёт, работаешь в другой
for: Живой проект, где фронтов работы несколько и часть упирается во внешнее (сервер, доступы, люди).
order: 2
questions:
  - key: goal
    label: Цель
    ask: Ради чего проект — что должно происходить в жизни, когда всё работает?
    hint: «неделю веду канал только через бота»
    required: true
  - key: directions
    label: Направления
    ask: Какие у проекта фронты работы? Через запятую — можно оставить пустым, будут стандартные.
    hint: «Продукт, Публикация, Контент, Качество»
method: |
  Проект — это несколько независимых направлений. Каждое движется само, у каждого свой критерий.
  Если направление упёрлось во внешнее, его узел «ждёт» с причиной и условием возврата, а работа идёт в других.
  Вкладка «Сейчас» показывает всё, что можно делать прямо сейчас, по всем направлениям сразу.
  Раз в неделю — пройтись по «Ждёт»: не наступило ли условие возврата.
rules: |
  - Перед началом проверь, не ждёт ли узел или его направление чего-то внешнего.
  - Если задача упирается во внешнее, не обходи это костылём: поставь «ждёт» и скажи, что нужно от человека.
nodes:
  - title: Продукт
    who: agent
    done_when: Главный сценарий работает от начала до конца у человека со стороны.
    body: |
      То, ради чего проект существует: функции, интерфейс, сценарии.
  - title: Качество и проверка
    who: agent
    done_when: Тесты на главный сценарий зелёные, ошибки понятны человеку, есть способ проверить всё одной командой.
  - title: Запуск и инфраструктура
    who: any
    done_when: "{{goal}}"
    body: |
      Сервер, домен, деплой, бэкапы, мониторинг. Здесь часто ждём внешнего — это нормально.
  - title: Люди и контент
    who: human
    done_when: Первые настоящие пользователи пришли и пользуются.
    body: |
      Тексты, маркетинг, показать живым людям, собрать обратную связь.
  - title: Идеи
    status: idea
    body: |
      Всё, что всплыло и не нужно прямо сейчас. Раз в неделю — разобрать: что-то в направления, что-то в отказ.
directions_from: directions
