id: discovery
name: Поиск улучшений
tagline: Исход → возможности → решения → проверки
for: Продукт работает, но непонятно, что делать дальше. Дерево возможностей Терезы Торрес.
order: 4
questions:
  - key: goal
    label: Исход
    ask: Какой результат хочешь сдвинуть? Лучше всего — число или поведение людей.
    hint: «половина пришедших по ссылке оставляет отзыв», «пост набирает 1.4× медианы канала»
    required: true
  - key: users
    label: Кто
    ask: Для кого улучшаем — кто эти люди?
    hint: «владельцы небольших кафе», «я сам как автор канала»
method: |
  Дерево возможностей. Корень — исход, который хотим сдвинуть.
  Под ним — возможности: боли, желания и нужды людей (это не фичи, а то, что люди хотят сделать).
  Под возможностью — несколько решений, минимум три, чтобы было из чего выбрать.
  Под решением — проверки: самое рискованное допущение решения проверяем дёшево, до того как строить.
  Работаем по одной возможности за раз; строим только то, что прошло проверки.
rules: |
  - Уровни дерева: возможность → решение → проверка. Не заводи решение без возможности над ним.
  - Проверка — самое дешёвое, что подтвердит или опровергнет допущение: разговор, макет, ручной прогон, замер.
  - Итог проверки — в журнал узла: что ожидали, что вышло, что решили.
nodes:
  - title: Возможности
    who: any
    body: |
      Боли, желания и нужды {{users_or_people}}. Формулируй от лица человека: «хочу…», «не могу…», «боюсь…».
    children:
      - title: Поговорить с людьми и записать боли
        who: human
        done_when: Записаны 5+ разговоров или наблюдений, из них выписаны возможности.
      - title: Посмотреть на числа — где люди отваливаются
        who: any
        done_when: Найден шаг, где теряется больше всего людей, с числами.
  - title: Идеи решений без возможности
    status: idea
    body: |
      Решения, которые пришли в голову раньше, чем понятно, какую боль они снимают. Найдём им место или откажемся.
