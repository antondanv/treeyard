id: client
name: Заказ
tagline: Этапы с согласованием и ссылкой на стенд после каждого
for: Проект для клиента — сайт, лендинг, доработка.
order: 5
questions:
  - key: goal
    label: Результат
    ask: Что получит заказчик в конце — и как вы оба поймёте, что работа принята?
    hint: «сайт на домене заказчика, контент заполнен, заказчик подписал акт»
    required: true
  - key: client
    label: Заказчик
    ask: Как зовут заказчика или компанию?
    hint: «Уралцветметремонт»
  - key: preview
    label: Стенд
    ask: Где заказчик смотрит результат после этапа?
    hint: «http://127.0.0.1:3000», «превью на Vercel»
method: |
  Работа идёт этапами. Перед этапом — его состав и ожидаемый результат согласуются с заказчиком.
  После этапа — стенд поднят, ссылка у заказчика, этап «на проверке», пока он не подтвердит.
  Баг или регрессия в принятом этапе — сначала исправить, потом дальше по плану.
  Между этапами не остаётся битых ссылок: если кнопка ведёт на новую страницу, страница появляется в том же этапе.
rules: |
  - После этапа подними стенд и дай ссылку: {{preview_or_default}}. Кратко: что изменено, что посмотреть.
  - Не хватает данных — сначала старые материалы заказчика, потом реалистичные заглушки, помеченные как заглушки.
  - Новые блоки и страницы — модульными, чтобы потом подставить настоящие данные заказчика.
nodes:
  - title: ТЗ и договорённости
    who: human
    done_when: Заказчик подтвердил состав работ и этапы.
    body: |
      Что делаем, чего не делаем, сроки, кто что даёт (тексты, фото, доступы). {{client_line}}
  - title: Этап 1
    who: agent
    done_when: Заказчик посмотрел по ссылке и подтвердил этап.
  - title: Запуск
    who: human
    done_when: "{{goal}}"
    body: |
      Домен, хостинг, перенос контента, финальная проверка с заказчиком, акт.
  - title: Пожелания заказчика на потом
    status: idea
    body: |
      То, что заказчик попросил по ходу и что не входит в текущий объём. Отдельная договорённость.
